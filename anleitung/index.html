<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Rising Frost</title>
<link rel="preload" href="D-DIN-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"D-DIN";src:url(D-DIN.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"D-DIN";src:url(D-DIN-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Stationsmono";src:url(Stationsmono-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
:root{
  --grund:#10110c;--tafel:#171912;--flaeche:rgba(184,180,156,.05);--linie:rgba(184,180,156,.16);--linie2:rgba(184,180,156,.3);
  --fg:#ece9db;--text:#b9b6a8;--leise:#a09d8f;--akzent:#c8b27a;--akzent-hell:#d8c48e;--akzent-text:#171107;
  --gut:#7fd39a;--warn:#ff8a6a;--eis:#b8b49c;
  --titel:"D-DIN","Bahnschrift","Segoe UI",system-ui,sans-serif;--mono:"Stationsmono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--grund)}
body{margin:0;background:var(--grund);color:var(--text);font:16px/1.6 var(--titel);-webkit-font-smoothing:antialiased}
a{color:var(--akzent)}
strong{color:var(--fg);font-weight:700}
em{font-style:normal;color:var(--fg);font-weight:700}
code{font:600 13px/1.4 var(--mono);color:var(--fg);background:var(--flaeche);border:1px solid var(--linie);padding:1px 6px;overflow-wrap:anywhere}

/* Kopf mit Bild aus dem Spiel */
.held{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;
  background:linear-gradient(180deg,rgba(16,17,12,.25) 0%,rgba(16,17,12,.35) 40%,rgba(16,17,12,.92) 82%,var(--grund) 100%),
    linear-gradient(90deg,rgba(16,17,12,.7) 0%,rgba(16,17,12,0) 60%),url(kopf.jpg) center 35%/cover no-repeat;
  border-top:3px solid var(--akzent)}
.held-innen{width:100%;max-width:1040px;margin:0 auto;padding:96px 24px 40px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chips span{font:700 11px/1 var(--titel);letter-spacing:.22em;text-transform:uppercase;color:var(--akzent);
  border:1px solid rgba(200,178,122,.45);background:rgba(16,17,12,.55);padding:6px 10px}
h1{margin:0;font:700 clamp(44px,8vw,92px)/.95 var(--titel);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);
  text-shadow:0 2px 24px rgba(0,0,0,.45)}
.unterzeile{margin:10px 0 0 4px;font:400 14px/1 var(--titel);letter-spacing:.42em;text-transform:uppercase;color:var(--akzent)}
.anriss{max-width:620px;margin:22px 0 0;font-size:18px;color:var(--text)}
.aktionen{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.knopf{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;font:700 14px/1 var(--titel);
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--fg);background:rgba(16,17,12,.55);
  border:1px solid var(--linie2);transition:background .15s,border-color .15s,color .15s}
.knopf:hover{border-color:var(--akzent);background:rgba(200,178,122,.1)}
.knopf.haupt{background:var(--akzent);border-color:var(--akzent);color:var(--akzent-text)}
.knopf.haupt:hover{background:var(--akzent-hell);border-color:var(--akzent-hell)}
.knopf:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--akzent-hell);outline-offset:3px}
.fein{margin:14px 0 0;font-size:13px;color:var(--leise)}

/* Inhalt */
.inhalt{max-width:1040px;margin:0 auto;padding:24px 24px 16px}
h2{margin:0 0 16px;font:700 12px/1 var(--titel);letter-spacing:.24em;text-transform:uppercase;color:var(--akzent)}
h2::after{content:"";display:block;height:1px;margin-top:12px;background:var(--linie)}
section{margin:0 0 28px}
.schritte{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.schritte li{background:var(--flaeche);border:1px solid var(--linie);padding:18px 18px 16px;position:relative}
.schritte .nr{display:block;font:700 34px/1 var(--titel);color:rgba(200,178,122,.55);letter-spacing:.04em}
.schritte h3{margin:10px 0 6px;font:700 15px/1.2 var(--titel);letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.schritte p{margin:0;font-size:14.5px;line-height:1.55}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tafel{background:var(--tafel);border:1px solid var(--linie);padding:20px 22px;margin:0 0 16px}
.tasten{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;align-items:center}
.tasten dt{display:flex;gap:4px;align-items:center;color:var(--leise)}
.tasten dd{margin:0;font-size:14.5px;color:var(--text)}
kbd{display:inline-block;min-width:24px;padding:3px 7px;font:600 11.5px/1.2 var(--mono);color:var(--fg);text-align:center;
  background:#1c1e17;border:1px solid var(--linie2);border-bottom-width:2px}
.neu{list-style:none;margin:0;padding:0}
.neu li{display:grid;grid-template-columns:58px 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--linie)}
.neu li:last-child{border-bottom:0}
.neu .marke{align-self:start;margin-top:2px;font:700 10px/1 var(--titel);letter-spacing:.12em;text-align:center;padding:5px 0;
  color:var(--akzent);background:rgba(200,178,122,.14)}
.neu .marke.fix{color:var(--gut);background:rgba(127,211,154,.12)}
.neu .marke.schneller{color:var(--eis);background:rgba(184,180,156,.14)}
.neu .was{font-size:14.5px;line-height:1.45}
.neu .was b{color:var(--fg)}
.neu .wann{grid-column:2;font-size:12px;color:var(--leise);opacity:.8}
.neu li.leise{display:block;color:var(--leise)}
.neu-fuss{margin:12px 0 0;font-size:12.5px;color:var(--leise)}
.liste{margin:0;padding-left:18px}
.liste li{margin:6px 0;font-size:14.5px}
.liste li::marker{color:var(--akzent)}
.leise{color:var(--leise);font-size:13.5px}
.fuss{max-width:1040px;margin:0 auto;padding:8px 24px 40px;font-size:13px;color:var(--leise)}
.fuss p{margin:0;padding-top:18px;border-top:1px solid var(--linie)}
@media (max-width:900px){.schritte{grid-template-columns:repeat(2,1fr)}.drei{grid-template-columns:1fr}.zwei{grid-template-columns:1fr}}
@media (max-width:520px){.schritte{grid-template-columns:1fr}.held-innen{padding:72px 16px 32px}.inhalt,.fuss{padding-left:16px;padding-right:16px}
  .knopf{width:100%}.unterzeile{letter-spacing:.3em}}

/* Sperre und Hinweis fürs Handy */
.sperre{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(180deg,rgba(16,17,12,.55),rgba(16,17,12,.9) 70%,var(--grund)),url(kopf.jpg) center 35%/cover no-repeat;
  border-top:3px solid var(--akzent)}
.sperre-tafel{width:100%;max-width:420px;padding:34px 30px 28px;background:rgba(23,25,18,.9);border:1px solid var(--linie);
  box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
.sperre h1{font-size:clamp(34px,8vw,46px)}
.sperre .unterzeile{margin:10px 0 0;font-size:12px}
.sperre p{margin:18px 0 0;color:var(--text)}
.sperre form{display:flex;gap:8px;margin-top:22px}
.sperre input{flex:1;min-width:0;height:46px;padding:0 14px;font:16px var(--titel);color:var(--fg);background:#0c0d09;
  border:1px solid var(--linie2);border-radius:0}
.sperre input::placeholder{color:var(--leise)}
.sperre button{height:46px;padding:0 20px;font:700 13px/1 var(--titel);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  color:var(--akzent-text);background:var(--akzent);border:1px solid var(--akzent);border-radius:0}
.sperre button:hover{background:var(--akzent-hell)}
#fehler{min-height:1.5em;margin:12px 0 0;font-size:14px;color:var(--warn)}
.sperre .chips{justify-content:center;margin:0 0 16px}
</style>
</head>

<div id="handy" class="sperre" hidden>
  <div class="sperre-tafel">
    <p class="chips"><span>Nur am PC</span></p>
    <h1>Rising Frost</h1>
    <p class="unterzeile">A Co-op Descent</p>
    <p>Ein Spiel von Marcel. Es läuft nur auf einem Windows-PC, nicht auf Handy oder Tablet.</p>
    <p><strong>Öffne diese Seite bitte am PC.</strong></p>
  </div>
</div>
<div id="schloss" class="sperre">

  </div>
</div>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"]/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[z]);
const mb = b => (b / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 0 }) + ' MB';
function alter(t) {
  const s = Date.now() / 1000 - t;
  if (!(t > 0) || s < 0) return '';
  if (s < 3600) return 'vor ' + Math.max(1, Math.round(s / 60)) + ' min';
  if (s < 86400) return 'vor ' + Math.floor(s / 3600) + ' Std.';
  if (s < 172800) return 'gestern';
  if (s < 1209600) return 'vor ' + Math.floor(s / 86400) + ' Tagen';
  return new Date(t * 1000).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
}
// Stand, Größe und Neuerungen aus der Liste des Starters
async function standLaden(m) {
  const liste = m.querySelector('[data-neu]');
  try {
    const r = await fetch('../nativ/version.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const v = await r.json();
    const groesse = Object.values(v.dateien || {}).reduce((s, d) => s + (d.groesse || 0), 0);
    const gebaut = v.gebaut ? new Date(v.gebaut).toLocaleString('de-DE', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
    m.querySelectorAll('[data-stand]').forEach(e => e.textContent = 'Stand ' + String(v.bau || '').split('-')[0] + (gebaut ? ' vom ' + gebaut : ''));
    if (groesse) {
      m.querySelectorAll('[data-groesse]').forEach(e => e.textContent = 'etwa ' + mb(groesse));
      m.querySelectorAll('[data-platz]').forEach(e => e.textContent = 'Etwa ' + mb(Math.ceil(groesse * 1.15 / 5e7) * 5e7));
    }
    const neu = (v.neu || []).slice(0, 10);
    if (!neu.length) { liste.innerHTML = '<li class="leise">Noch keine Liste der Neuerungen in diesem Stand.</li>'; return; }
    liste.innerHTML = neu.map(n => {
      const [kopf, ...rest] = String(n.text).split(' - ');
      const art = n.art === 'fix' ? 'fix' : n.art === 'schneller' ? 'schneller' : 'neu';
      const name = { neu: 'NEU', fix: 'FIX', schneller: 'TEMPO' }[art];
      return '<li><span class="marke ' + art + '">' + name + '</span><span class="was"><b>' + esc(kopf) + '</b>' +
        (rest.length ? ' – ' + esc(rest.join(' - ')) : '') + '</span><span class="wann">' + esc(alter(n.zeit)) + '</span></li>';
    }).join('');
    if ((v.neu || []).length > neu.length) liste.insertAdjacentHTML('afterend', '<p class="neu-fuss">Die letzten ' + neu.length + ' von ' + v.neu.length + ' Neuerungen. Der Starter zeigt, was seit deinem letzten Start dazugekommen ist.</p>');
  } catch (_) {
    m.querySelectorAll('[data-stand]').forEach(e => e.textContent = 'aktueller Stand');
    liste.innerHTML = '<li class="leise">Die Liste der Neuerungen ließ sich gerade nicht laden.</li>';
  }
}
async function oeffnen(pw) {
  const roh = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salz), iterations: D.runden }, roh,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, k, bytes(D.daten));
  const m = document.getElementById('inhalt');
  m.innerHTML = new TextDecoder().decode(klar);
  m.hidden = false;
  document.getElementById('schloss').remove();
  window.scrollTo(0, 0);
  return standLaden(m);
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = document.getElementById('fehler'), pw = document.getElementById('pw').value;
  if (!pw) { f.textContent = 'Bitte das Passwort eingeben.'; return; }
  f.textContent = 'Prüfe …';
  try { await oeffnen(pw); } catch (_) { f.textContent = 'Falsches Passwort.'; }
});
}
