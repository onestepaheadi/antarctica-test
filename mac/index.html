const SCHLUESSEL = 'rising-frost-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function oeffnen(pw) {
  const roh = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salz), iterations: D.runden }, roh,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const klar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, k, bytes(D.daten));
  return new TextDecoder().decode(klar);
}
function zeigen(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById('sperre'), feld = document.getElementById('pw'), knopf = document.getElementById('los'),
  fehler = document.getElementById('fehler');
(async () => {
  let gemerkt = null;
  try { gemerkt = localStorage.getItem(SCHLUESSEL); } catch (_) {}
  if (gemerkt) { try { return zeigen(await oeffnen(gemerkt)); } catch (_) { try { localStorage.removeItem(SCHLUESSEL); } catch (_) {} } }
  form.hidden = false; feld.focus();
})();
form.addEventListener('submit', async e => {
  e.preventDefault();
  knopf.disabled = true; fehler.textContent = '';
  try {
    const html = await oeffnen(feld.value);
    try { localStorage.setItem(SCHLUESSEL, feld.value); } catch (_) {}
    zeigen(html);
  } catch (_) {
    fehler.textContent = 'Passwort stimmt nicht.'; knopf.disabled = false; feld.select();
  }
});
</script>
